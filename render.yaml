# Render Blueprint Specification for PAYFLOW AI (Prompt 30)
# Infrastructure as Code: 1 FastAPI Web Service + 1 Static Frontend + 1 Cron Service

services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: payflow-ai-backend
    runtime: python
    region: oregon
    plan: starter
    branch: main
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: PAYFLOW AI
      - key: APP_SECRET_KEY
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: payflow_db
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-3.8-flash
      - key: AI_API_KEY
        sync: false
      - key: ZAPIER_WEBHOOK_URL
        sync: false
      - key: ZAPIER_SHARED_SECRET
        sync: false
      - key: RUN_BACKGROUND_SCHEDULER
        value: "true"

  # ---------------------------------------------------------------------------
  # 2. React + Vite Static Frontend
  # ---------------------------------------------------------------------------
  - type: web
    name: payflow-ai-frontend
    runtime: static
    region: oregon
    plan: free
    branch: main
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: payflow-ai-backend
          property: host

  # ---------------------------------------------------------------------------
  # 3. Optional Dedicated Daily Reminder Cron Job
  # ---------------------------------------------------------------------------
  - type: cron
    name: payflow-daily-reminders
    runtime: python
    region: oregon
    plan: starter
    schedule: "0 9 * * *"  # Every day at 9:00 AM UTC
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python -m app.jobs.reminder_job"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: payflow_db
      - key: APP_SECRET_KEY
        sync: false
      - key: ZAPIER_WEBHOOK_URL
        sync: false
      - key: ZAPIER_SHARED_SECRET
        sync: false

